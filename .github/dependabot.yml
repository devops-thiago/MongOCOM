version: 2
updates:
  # Enable version updates for Maven
  - package-ecosystem: "maven"
    # Look for pom.xml and parent/child pom.xml files in root directory
    directory: "/"
    # Check for updates daily at 9am UTC
    schedule:
      interval: "daily"
      time: "09:00"
    # Allow up to 5 open pull requests for Maven dependencies
    open-pull-requests-limit: 5
    # Add reviewers
    reviewers:
      - "devops-thiago"
    # Add assignees
    assignees:
      - "devops-thiago"
    # Customize commit messages
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Group all patch updates into a single PR
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Keep SHA-pinned GitHub Actions up to date. Dependabot rewrites the pinned
  # SHA and the trailing "# vX.Y.Z" comment together, so pins never go stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "devops-thiago"
    assignees:
      - "devops-thiago"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"